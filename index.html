<!DOCTYPE html>
<html lang="vi" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/assets/branding/logo.jpeg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <!--seo-head-->
    <!-- Be Vietnam Pro remains the fixed heading, body and UI face. Only used weights. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
    <meta name="author" content="Hẻm Nhà Living by NK" />
    <meta name="theme-color" content="#faf6f0" />
    <!-- Scroll-reveal start states apply only once this script has run. Without JS (or if the bundle never hydrates) prerendered text stays visible. -->
    <script>document.documentElement.classList.add('js')</script>
    <style>
      @keyframes reveal-failsafe { to { opacity: 1; translate: none; transform: none; } }
      html:not(.js) main .opacity-0 { opacity: 1 !important; translate: none !important; transform: none !important; }
      html.js:not([data-hydrated]) main .opacity-0 { animation: reveal-failsafe 0s 2.5s forwards; }
    </style>
    <noscript><style>main .opacity-0 { opacity: 1 !important; translate: none !important; transform: none !important; }</style></noscript>
  </head>
  <body class="bg-nagi-sand text-nagi-charcoal antialiased selection:bg-nagi-gold selection:text-white min-h-screen overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
